<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>YTM AI Artist Detector</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="popup is-loading">

    <header class="popup-header">
      <h1 class="popup-title">Auto-skip</h1>
      <p class="popup-hint" id="autoskip-hint">
        Presses Next automatically when a track's artist is in a selected category.
      </p>
    </header>

    <label class="popup-row is-master">
      <span class="popup-row-label">Enable auto-skip</span>
      <input class="popup-switch" type="checkbox" id="autoskip-enabled" role="switch" aria-describedby="autoskip-hint">
    </label>

    <fieldset class="popup-group" id="category-group">
      <legend class="popup-group-title">Skip these categories</legend>
      <!-- popup.js clones the template below once per CATEGORY_ORDER entry -->
    </fieldset>

    <!-- Both sections sit outside the fieldset above: its :disabled rules cascade to every
         descendant, and these lists stay usable while the master toggle is off. -->
    <section class="popup-group">
      <h2 class="popup-group-title">Never skip</h2>
      <p class="popup-empty" id="noskip-empty">No artists yet. Add them from the list below.</p>
      <div class="popup-list" id="noskip-list"></div>
    </section>

    <section class="popup-group">
      <h2 class="popup-group-title">Recently skipped</h2>
      <p class="popup-empty" id="history-empty">Nothing skipped yet.</p>
      <div class="popup-list" id="history-list"></div>
      <button class="popup-button" type="button" data-action="clear-history">Clear history</button>
    </section>

    <p class="popup-error" id="popup-error" role="status" hidden></p>

    <template id="category-row-template">
      <label class="popup-row">
        <span class="popup-row-badge" aria-hidden="true">
          <span class="artist-badge"></span>
        </span>
        <span class="popup-row-label"></span>
        <input class="popup-switch" type="checkbox" role="switch">
      </label>
    </template>

    <!-- Artist rows are divs, not labels: they carry a button rather than a checkbox. -->
    <template id="noskip-row-template">
      <div class="popup-row">
        <span class="popup-row-label"></span>
        <button class="popup-row-action" type="button" data-action="remove-noskip">&times;</button>
      </div>
    </template>

    <template id="history-row-template">
      <div class="popup-row">
        <span class="popup-row-badge" aria-hidden="true">
          <span class="artist-badge"></span>
        </span>
        <span class="popup-row-label"></span>
        <button class="popup-row-action" type="button" data-action="add-noskip">+</button>
      </div>
    </template>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
