<!-- This file has been created with the assistance of an AI tool. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>YTM AI Artist Detector</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body class="popup is-loading">

    <header class="popup-header">
      <h1 class="popup-title">Auto-skip</h1>
      <p class="popup-hint" id="autoskip-hint">
        Presses Next automatically when a track's artist is in a selected category.
      </p>
    </header>

    <label class="popup-row is-master">
      <span class="popup-row-label">Enable auto-skip</span>
      <input class="popup-switch" type="checkbox" id="autoskip-enabled" role="switch" aria-describedby="autoskip-hint">
    </label>

    <!-- Hidden wholesale while the master toggle is off: with auto-skip disabled none of it is
         actionable, so the popup collapses to the toggle it exists for. Neither this element nor
         a panel below may be given a display in CSS - one would out-specify the UA's
         [hidden] { display: none } and the collapse would silently stop collapsing. -->
    <div class="popup-sections" id="popup-sections" hidden>

      <section class="popup-section" data-section="categories">
        <h2 class="popup-section-heading">
          <button class="popup-section-toggle" type="button" id="category-toggle"
                  data-action="toggle-section" aria-expanded="false" aria-controls="category-panel">
            <span class="popup-section-caret" aria-hidden="true"></span>
            <span class="popup-section-label">Skip these categories</span>
            <span class="popup-section-count" id="category-count"></span>
          </button>
        </h2>
        <div class="popup-section-panel" id="category-panel" hidden>
          <!-- No <legend>: the header button above names the group through aria-labelledby, so
               the same three words are not read twice. popup.js clones the template below once
               per CATEGORY_ORDER entry. -->
          <fieldset class="popup-group" id="category-group" aria-labelledby="category-toggle">
          </fieldset>
        </div>
      </section>

      <section class="popup-section" data-section="noskip">
        <h2 class="popup-section-heading">
          <button class="popup-section-toggle" type="button"
                  data-action="toggle-section" aria-expanded="false" aria-controls="noskip-panel">
            <span class="popup-section-caret" aria-hidden="true"></span>
            <span class="popup-section-label">Never skip</span>
            <span class="popup-section-count" id="noskip-count"></span>
          </button>
        </h2>
        <div class="popup-section-panel" id="noskip-panel" hidden>
          <p class="popup-empty" id="noskip-empty">No artists yet. Add them from Recently skipped.</p>
          <div class="popup-list" id="noskip-list"></div>
        </div>
      </section>

      <section class="popup-section" data-section="history">
        <h2 class="popup-section-heading">
          <button class="popup-section-toggle" type="button"
                  data-action="toggle-section" aria-expanded="false" aria-controls="history-panel">
            <span class="popup-section-caret" aria-hidden="true"></span>
            <span class="popup-section-label">Recently skipped</span>
            <span class="popup-section-count" id="history-count"></span>
          </button>
        </h2>
        <div class="popup-section-panel" id="history-panel" hidden>
          <p class="popup-empty" id="history-empty">Nothing skipped yet.</p>
          <div class="popup-list" id="history-list"></div>
          <button class="popup-button" type="button" data-action="clear-history">Clear history</button>
        </div>
      </section>

    </div>

    <p class="popup-error" id="popup-error" role="status" hidden></p>

    <template id="category-row-template">
      <label class="popup-row">
        <span class="popup-row-badge" aria-hidden="true">
          <span class="artist-badge"></span>
        </span>
        <span class="popup-row-label"></span>
        <input class="popup-switch" type="checkbox" role="switch">
      </label>
    </template>

    <!-- Artist rows are divs, not labels: they carry a button rather than a checkbox. -->
    <template id="noskip-row-template">
      <div class="popup-row">
        <span class="popup-row-label"></span>
        <button class="popup-row-action" type="button" data-action="remove-noskip">&times;</button>
      </div>
    </template>

    <template id="history-row-template">
      <div class="popup-row">
        <span class="popup-row-badge" aria-hidden="true">
          <span class="artist-badge"></span>
        </span>
        <span class="popup-row-label"></span>
        <button class="popup-row-action" type="button" data-action="add-noskip">+</button>
      </div>
    </template>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
